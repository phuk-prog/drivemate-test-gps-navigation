name: Validate published comparison
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate public scripts and result consistency (not app execution)
        run: |
          python3 -m py_compile scripts/run.py scripts/compare.py
          python3 scripts/compare.py
